
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Readers | Family Intake</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>
<div class="container">

    <header>
        <div class="book">📚 🌷</div>
        <h1>Little Readers</h1>
        <p>A little information helps us share a lot of stories!</p>
    </header>

    <form id="intakeForm">

        <section class="section">
            <h2>🏡 Household</h2>

            <label for="zipCode">ZIP Code</label>
            <input id="zipCode" name="zipCode" required>

            <label for="booksInHousehold">Books currently at home</label>
            <input id="booksInHousehold" name="booksInHousehold"
                   type="number" min="0" value="0">

            <label for="readers">Number of people who can read</label>
            <input id="readers" name="readers" type="number"
                   min="0" value="0">
        </section>

        <section class="section">
            <h2>💜 Parent / Caregiver</h2>
            <label>First name</label>
            <input name="parentFirstName" required>

            <label for="parentEmail">Email address</label>
            <input id="parentEmail" name="parentEmail"
                   type="email" required>

            <label for="parentCanRead">Can you read?</label>
            <select id="parentCanRead" name="parentCanRead">
                <option value="yes">Yes</option>
                <option value="no">No</option>
            </select>
        </section>

        <section class="section">
            <h2>🧸 Little Readers</h2>

            <div id="children"></div>

            <button type="button" class="add" id="addChild">
                + Add another child
            </button>
        </section>

        <button type="submit" class="submit">
            Submit Family Information 💌
        </button>

    </form>

    <pre id="output"></pre>
</div>

<template id="childTemplate">
    <div class="child">
        <h3>🌼 Child</h3>

        <label>First name</label>
        <input name="firstName" required>

        <label>Language</label>
        <input name="language" placeholder="e.g. English">

        <label>Books received</label>
        <input name="booksReceived" type="number" min="0" value="0">

        <label>Days per month reading with parent</label>
        <input name="readingDays" type="number" min="0" max="31" value="0">

        <button type="button" class="remove">Remove child</button>
    </div>
</template>

<script src="app.js"></script>

</body>
</html>
